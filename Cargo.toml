[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/proto",
    "crates/storage",
    "crates/inference",
    "crates/inference-client",
    "crates/gallery",
    "crates/search",
    "crates/api-gateway",
    "crates/cli",
]
# Model-owned native extractor: separate lockfiles pinned by the build (ml/MODEL_GUIDE.md).
exclude = ["ml/inference/rust", "ml/inference/offline"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
common = { path = "crates/common" }
proto = { path = "crates/proto" }
storage = { path = "crates/storage" }
inference = { path = "crates/inference" }
inference-client = { path = "crates/inference-client" }

anyhow = "1"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }

tonic = "0.14"
tonic-prost = "0.14"
tonic-health = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
protox = "0.9"

axum = "0.8"

object_store = "0.11"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
