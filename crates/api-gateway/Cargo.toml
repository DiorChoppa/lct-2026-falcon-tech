[package]
name = "api-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Владелец: Кирилл. Тонкий шлюз: REST + OpenAPI + валидация входа, дальше
# gRPC в gallery/search/inference. В БД не ходит, sqlx/pgvector здесь нет.

[dependencies]
common.workspace = true
proto.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonic.workspace = true
tonic-health.workspace = true
axum = { workspace = true, features = ["multipart"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
async-trait.workspace = true
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
tower-http = { version = "0.7", features = ["fs"] }
# Только размеры кадра по заголовку файла для валидации bbox; декодирует gallery/search/inference.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
futures = "0.3"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
