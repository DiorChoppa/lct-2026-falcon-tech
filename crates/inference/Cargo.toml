[package]
name = "inference"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Owner: Ivan.

[dependencies]
common.workspace = true
proto.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower-http = { version = "0.7", features = ["cors", "trace"] }
config = "0.15"
dotenvy = "0.15"
getset = "0.1"
utoipa = "5"
utoipa-rapidoc = { version = "6", features = ["axum"] }
ort = { version = "=2.0.0-rc.13", features = ["ndarray", "download-binaries"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ndarray = "0.17"
# crop_uri resolution (infrastructure::grpc::crop_loader): file:// now, s3://
# once crates/storage lands.
object_store.workspace = true
url.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
rstest = "0.26"
ndarray-npy = "0.9"
tempfile = "3"
# ndarray-npy depends on ndarray 0.16, while our main ndarray (for ort) is 0.17;
# these are two distinct types, so reading .npy in tests/parity.rs needs a
# separate alias pinned to the version ndarray-npy actually uses.
ndarray-for-npy = { package = "ndarray", version = "0.16" }
