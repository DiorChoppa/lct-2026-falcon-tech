<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e131b" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Поиск транспортного средства по внешнему виду без ГРЗ: кадр и bbox → топ-N кандидатов из галереи с уверенностью или честный отказ."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ReID ТС — поиск без ГРЗ</title>
    <script>
      // Тема до первой отрисовки, чтобы не мигало: сохранённый выбор или системная.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("theme"); } catch (e) {}
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
