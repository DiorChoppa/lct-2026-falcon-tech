server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;

    # Basic auth на публичном инстансе: 40-basic-auth.sh пишет сюда auth_basic по
    # BASIC_AUTH_USER/BASIC_AUTH_PASSWORD из окружения; без них файл пустой — доступ открыт.
    include /etc/nginx/basic-auth.conf;

    # Health без пароля — для мониторинга и проверки жюри
    location = /api/health { auth_basic off; proxy_pass http://api:8080; }

    # 600s — импорт галереи по CSV датасета идёт синхронно
    location /api/   { proxy_pass http://api:8080; proxy_read_timeout 600s; }
    location /files/ { proxy_pass http://api:8080; }
    # config.js пишется при старте контейнера (YMAPS_KEY) — всегда сверять с сервером
    location = /config.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
