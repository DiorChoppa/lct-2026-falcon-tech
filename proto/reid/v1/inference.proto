syntax = "proto3";

package reid.v1;

// Сервис формирования эмбеддинга. Горячий путь: именно его латентность
// при batch=1 и FPS при пакетной обработке замеряет жюри.
service Inference {
  // Эмбеддинги для одного или нескольких кадров, в каждом кадре 1..N bbox.
  // Ответ содержит по одному Embedding на каждый bbox в порядке запроса.
  rpc Embed(EmbedRequest) returns (EmbedResponse);
  // Метаданные загруженной модели (для /info в api и для отчёта).
  rpc Info(InfoRequest) returns (InfoResponse);
}

message BBox {
  int32 x = 1;
  int32 y = 2;
  int32 w = 3;
  int32 h = 4;
}

message FrameWithBoxes {
  // Полный кадр JPEG/PNG в исходном разрешении камеры.
  bytes image = 1;
  repeated BBox boxes = 2;
  // Произвольный идентификатор для сопоставления ответа с запросом.
  string frame_id = 3;
}

// Ссылка на уже вырезанный кроп (пишут gallery/search). Используется вместо
// повторной пересылки полного кадра, когда кроп уже сохранён.
message CropRef {
  // object_store URL: "s3://gallery-crops/<item_id>.jpg" в проде,
  // "file:///data/crops/<item_id>.jpg" локально до готовности S3.
  string uri = 1;
  // Произвольный идентификатор для сопоставления ответа с запросом.
  string frame_id = 2;
  int32 box_index = 3;
}

message EmbedRequest {
  repeated FrameWithBoxes frames = 1;
  repeated CropRef crops = 2;
  // Запросить дополнительно патч-токены (см. Embedding.patches). Модель без
  // выхода patches отвечает ошибкой FAILED_PRECONDITION — проверяйте
  // Info.supports_patches заранее.
  bool with_patches = 3;
}

message Embedding {
  string frame_id = 1;
  int32 box_index = 2;
  // L2-нормированный вектор фиксированной размерности D (см. Info.dim).
  repeated float values = 3;
  // Патч-токены, только если EmbedRequest.with_patches=true и
  // Info.supports_patches=true. Плоский массив [grid_h*grid_w, patch_dim]
  // построчно; форму см. в Info.
  repeated float patches = 4;
}

message EmbedResponse {
  repeated Embedding embeddings = 1;
  // Время чистого инференса модели (без декодирования), микросекунды.
  int64 inference_us = 2;
}

message InfoRequest {}

message InfoResponse {
  string model_name = 1;
  string model_version = 2;
  int32 dim = 3;
  int32 input_height = 4;
  int32 input_width = 5;
  // "cpu" | "cuda"
  string execution_provider = 6;
  // Модель отдаёт второй выход с патч-токенами (для EmbedRequest.with_patches
  // и последующего local-матчинга в search).
  bool supports_patches = 7;
  int32 patch_grid_h = 8;
  int32 patch_grid_w = 9;
  int32 patch_dim = 10;
}
