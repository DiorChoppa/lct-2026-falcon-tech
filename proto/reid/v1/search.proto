syntax = "proto3";

package reid.v1;

import "inference.proto";
import "tagger.proto";

// Сервис поиска: kNN по галерее, патч-переранжирование, калибровка, порог,
// отказ, история поисков. Не пишет в галерею — это crates/gallery.
service Search {
  // Кадр + bbox + top_n → кандидаты с уверенностью либо честный отказ.
  rpc Search(SearchRequest) returns (SearchResponse);
  // Патч-токены query и кандидата из уже сохранённого поиска: совпавшие
  // области, local_score, теги кандидата.
  rpc Compare(CompareRequest) returns (CompareResponse);
  // История одного поиска в формате candidates.csv.
  rpc Export(ExportRequest) returns (ExportResponse);
}

message SearchRequest {
  // Полный кадр JPEG/PNG.
  bytes image = 1;
  BBox bbox = 2;
  uint32 top_n = 3;
  // Патч-переранжирование и local_score по каждому кандидату (иначе только
  // глобальный cosine — быстрее, без второго вызова inference).
  bool details = 4;
}

message Candidate {
  int64 gallery_id = 1;
  // Косинусное сходство глобальных векторов, 0..1.
  float score = 2;
  // Итоговая уверенность после калибровки и (если details=true) rerank с
  // alpha из model.json; то же значение решает accepted.
  float confidence = 3;
  // Заполнен только если details=true.
  float local_score = 4;
  string plate = 5;
  string crop_uri = 6;
}

message SearchResponse {
  int64 search_id = 1;
  string query_crop_uri = 2;
  // Топ-N по убыванию confidence, включая кандидатов ниже порога.
  repeated Candidate candidates = 3;
  // Хотя бы один кандидат прошёл порог; false — отказ.
  bool accepted = 4;
}

message CompareRequest {
  int64 search_id = 1;
  int64 gallery_id = 2;
}

message PatchMatch {
  Region query_region = 1;
  Region candidate_region = 2;
  float similarity = 3;
}

message CompareResponse {
  repeated PatchMatch matches = 1;
  // Доля взаимно совпавших патчей с весом по сходству, 0..1.
  float local_score = 2;
  // "few_shared_views", если ракурсы query и кандидата почти не пересекаются.
  string note = 3;
  // Теги галерейной записи (query тегами не покрывается — это не запись
  // галереи, tagger.Enqueue для неё не вызывается).
  repeated Tag candidate_tags = 4;
}

message ExportRequest {
  int64 search_id = 1;
}

message ExportResponse {
  // candidates.csv для этого поиска, формат — README датасета.
  bytes csv = 1;
}
