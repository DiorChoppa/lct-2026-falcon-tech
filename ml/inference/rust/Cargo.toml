[package]
name = "lct-inference"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
csv = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
turbojpeg = { version = "=1.5.1", default-features = false, features = ["cmake", "require-simd"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "cuda", "api-24"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libloading = "=0.9.0"
thiserror = "2"
